<div style="font-family: Helvetica, Arial, sans-serif; font-size: 14px; color: #1c1c1c; padding: 24px 8px; background-color: #f5f5f5;">
<div style="max-width: 600px; margin: auto; background-color: #ffffff;">

  <div style="background-color: #1c1c1c; padding: 20px 28px; text-align: center;">
    <img src="https://www.freedomofmovement.co.za/cdn/shop/files/FOM_4a277dc0-1749-4e5c-92ce-3fccd1ec7e55.png?v=1760905009&width=200" alt="Freedom of Movement" style="height: 28px;" />
  </div>

  <div style="padding: 28px;">
    <p style="font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #8a8a8a; margin: 0 0 6px;">Staff Allowance Balance</p>
    <p style="font-size: 20px; font-weight: bold; margin: 0 0 20px;">{{staff_name}}</p>
    <p style="font-size: 12px; color: #8a8a8a; margin: -14px 0 24px;">As at {{order_date}}</p>

    <table style="width:100%; border-collapse: collapse; background-color:#f5f5f5;">
      <tr>
        <td style="padding: 16px; color: #8a8a8a;">Annual Allowance</td>
        <td style="padding: 16px; text-align:right;">R{{total_allowance}}</td>
      </tr>
      <tr>
        <td style="padding: 16px; color: #8a8a8a;">Used So Far</td>
        <td style="padding: 16px; text-align:right;">R{{total_used}}</td>
      </tr>
      <tr>
        <td style="padding: 16px; font-weight: bold;">Balance Remaining</td>
        <td style="padding: 16px; text-align:right; font-weight: bold;">R{{balance_after}}</td>
      </tr>
    </table>

    <p style="font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #8a8a8a; margin: 32px 0 12px;">Your Allowance Purchases &mdash; {{period}}</p>
    <div style="white-space: pre-line; font-size: 12px; line-height: 1.8; color: #1c1c1c;">{{history_rows}}</div>
  </div>

  <div style="text-align:center; padding: 16px; font-size: 11px; color: #8a8a8a;">
    Freedom of Movement &middot; Staff Allowance Portal
  </div>

</div>
</div>
